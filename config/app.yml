# `return_to_allowed_origins` is the list of applications Cloakman will
# send somebody back to after they create an account (see ReturnTo).
# Origins only — the path is whatever the referring application asked for.

development:
  app_url:                <%= ENV.fetch('APP_URL', 'http://localhost:3000') %>
  return_to_allowed_origins:
    - http://localhost:3000
    - http://localhost:4200
  ldap_internal_endpoint: ldap://localhost:1389
  redis_url:              redis://localhost:6379
  submitter_gid_number:   1234

test:
  app_url:                http://cloakman.example.com
  return_to_allowed_origins:
    - http://repository.example.com:4200
  ldap_internal_endpoint: ldap://ldap.example.com:389
  redis_url:              redis://localhost:6379/1
  submitter_gid_number:   1234

production:
  app_url:                https://accounts.ddbj.nig.ac.jp
  return_to_allowed_origins:
    - https://repository.ddbj.nig.ac.jp
  ldap_internal_endpoint: ldaps://cloakman-production:636
  redis_url:              redis://cloakman-redis:6379
  submitter_gid_number:   60000

# Both the repository's staging and its dev environment authenticate
# against this one.
staging:
  app_url:                https://accounts-staging.ddbj.nig.ac.jp
  return_to_allowed_origins:
    - https://repository-staging.ddbj.nig.ac.jp
    - https://repository-dev.ddbj.nig.ac.jp
  ldap_internal_endpoint: ldaps://cloakman-staging:636
  redis_url:              redis://cloakman-redis:6379
  submitter_gid_number:   61000
