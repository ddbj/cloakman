default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: cloakman_development

test:
  <<: *default
  database: cloakman_test

production: &production
  primary:
    <<: *default
    url: <%= Rails.application.credentials.database_url %>
    database: cloakman

  cache:
    <<: *default
    url: <%= Rails.application.credentials.database_url %>
    database: cloakman_cache
    migrations_paths: db/cache_migrate

  queue:
    <<: *default
    url: <%= Rails.application.credentials.database_url %>
    database: cloakman_queue
    migrations_paths: db/queue_migrate

staging:
  <<: *production
